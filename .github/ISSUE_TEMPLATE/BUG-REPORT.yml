name: Bug Report
description: File a bug report.
labels: ["⚠️ bug"]
type: bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: dropdown
    id: modloader
    attributes:
      label: Mod Loader
      options:
        - Fabric
      default: 0
    validations:
      required: true
  - type: dropdown
    id: minecraftversion
    attributes:
      label: Minecraft Version
      options:
        - 26.1
        - 26.2
      default: 0
    validations:
      required: true
  - type: input
    id: enderscapeversion
    attributes:
      label: Enderscape Version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Game Log / Crash Report
      render: shell
